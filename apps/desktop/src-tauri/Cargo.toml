[package]
name = "ridgeline"
version = "0.1.0"
description = "Ridgeline: AI-assisted indoor cycling (desktop app)"
edition = "2021"
license = "MIT"
rust-version = "1.89"
publish = false

# Separate workspace: this crate pulls third-party dependencies (Tauri,
# btleplug, ureq, keyring) that the offline-buildable core does not.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
btleplug = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
uuid = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rl-app = { path = "../../../crates/app" }
rl-device = { path = "../../../crates/device" }
rl-net = { path = "../../../crates/net" }
rl-json = { path = "../../../crates/json" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "symbols"
panic = "unwind"
