name: Update lockfiles and notices

# Generates Cargo.lock for the desktop crate and package-lock.json for the UI
# (the build sandbox used for development has no registry access) and
# commits them back so later builds are pinned (cargo --locked / npm ci).
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/ui/package.json
      - .github/workflows/lockfiles.yml
      - scripts/gen-notices.mjs

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate
        run: |
          # Missing lockfile: generate. Existing: minimal update for manifest changes only.
          (cd apps/desktop/src-tauri && if [ -f Cargo.lock ]; then cargo metadata --format-version 1 > /dev/null; else cargo generate-lockfile; fi)
          (cd apps/desktop/ui && npm install --package-lock-only --no-audit --no-fund)
      - name: Third-party notices
        run: |
          (cd apps/desktop/ui && npm ci --no-audit --no-fund)
          cargo metadata --format-version 1 --manifest-path apps/desktop/src-tauri/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          node scripts/gen-notices.mjs "$RUNNER_TEMP/cargo-metadata.json" apps/desktop/ui > THIRD_PARTY_NOTICES.md
          head -20 THIRD_PARTY_NOTICES.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/ui/package-lock.json THIRD_PARTY_NOTICES.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update lockfiles and third-party notices (generated by CI)"
          git push
