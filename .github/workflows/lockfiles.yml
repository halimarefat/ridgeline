name: Update lockfiles

# Generates Cargo.lock for the desktop crate and package-lock.json for the UI
# (the build sandbox used for development has no registry access) and
# commits them back so later builds are pinned (cargo --locked / npm ci).
on:
  workflow_dispatch:
  push:
    branches: [dev, main]
    paths:
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/ui/package.json
      - .github/workflows/lockfiles.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate
        run: |
          # Missing lockfile: generate. Existing: minimal update for manifest changes only.
          (cd apps/desktop/src-tauri && if [ -f Cargo.lock ]; then cargo metadata --format-version 1 > /dev/null; else cargo generate-lockfile; fi)
          (cd apps/desktop/ui && npm install --package-lock-only --no-audit --no-fund)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/ui/package-lock.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update lockfiles (generated by CI)"
          git push
