name: Update lockfiles

# Generates Cargo.lock for the desktop crate and package-lock.json for the UI
# (the build sandbox used for development has no registry access) and
# commits them back so later builds are pinned (cargo --locked / npm ci).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate
        run: |
          (cd apps/desktop/src-tauri && cargo generate-lockfile)
          (cd apps/desktop/ui && rm -f package-lock.json && npm install --package-lock-only --no-audit --no-fund)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/ui/package-lock.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update lockfiles (generated by CI)"
          git push
